bind_session:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: bsv_settlement
    session_id:
      required: true
      selector:
        text:
    started_at:
      required: true
      example: "2026-10-02T02:00:00Z"
      selector:
        text:
    driver_binding_id:
      required: true
      default: driver-demo-01
      selector:
        text:
add_interval:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: bsv_settlement
    session_id:
      required: true
      selector:
        text:
    interval:
      required: true
      selector:
        object:
prepare_session:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: bsv_settlement
    session_id:
      required: true
      selector:
        text:
    ended_at:
      required: true
      selector:
        text:
    final_import_wh:
      required: true
      selector:
        number:
          min: 0
          max: 10000000
          mode: box
          unit_of_measurement: Wh
    final_export_wh:
      required: true
      selector:
        number:
          min: 0
          max: 10000000
          mode: box
          unit_of_measurement: Wh
request_payment:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: bsv_settlement
    session_id:
      required: true
      selector:
        text:
refresh:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: bsv_settlement
wallet_status:
  name: Operator wallet status
  description: Read the embedded testnet wallet status without network access or key export.
  fields:
    config_entry_id:
      required: true
      selector:
        text:
wallet_self_test:
  name: Offline operator wallet self-test
  description: Verify a real SDK signature and sign a fictional-source transaction. No broadcast or funds.
  fields:
    config_entry_id:
      required: true
      selector:
        text:
wallet_refresh_chain:
  name: Refresh mainnet wallet
  description: Read provider-reported confirmed UTXOs and payment status. Administrator only; does not broadcast.
  fields:
    config_entry_id:
      required: true
      selector:
        text:
prepare_operator_payment:
  name: Prepare operator payment
  description: Prepare an unsigned mainnet payment to the submitted driver address. Administrator only.
  fields:
    config_entry_id:
      required: true
      selector:
        text:
    reference:
      required: true
      selector:
        text:
    amount_sats:
      required: true
      selector:
        number:
          min: 1
          max: 100000
          mode: box
    fee_sats:
      required: true
      selector:
        number:
          min: 1
          max: 1000
          mode: box
broadcast_operator_payment:
  name: Approve and broadcast operator payment
  description: REAL MONEY. Repeat the exact prepared recipient, amount and fee. Administrator approval required.
  fields:
    config_entry_id:
      required: true
      selector:
        text:
    draft_id:
      required: true
      selector:
        text:
    recipient_address:
      required: true
      selector:
        text:
    amount_sats:
      required: true
      selector:
        number:
          min: 1
          max: 100000
          mode: box
    fee_sats:
      required: true
      selector:
        number:
          min: 1
          max: 1000
          mode: box
    confirm_mainnet_payment:
      required: true
      selector:
        boolean:
cancel_operator_payment:
  name: Cancel unsigned operator payment
  description: Cancel an unsigned prepared or expired draft. A submitted payment cannot be cancelled here.
  fields:
    config_entry_id:
      required: true
      selector:
        text:
    draft_id:
      required: true
      selector:
        text:
