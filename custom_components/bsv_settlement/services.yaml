configure_grouped_wallet_test:
  name: Configure native wallet authorisation test
  description: Administrator only. Opt in to a 30,000 sat monthly spending request in the shared external host manifest. This covers the whole host, not just charging. Does not grant authority, enable monthly settlement, sign payments or import receipts. Disabling withdraws the request but does not revoke a wallet permission.
  fields:
    enabled:
      required: true
      selector:
        boolean:
    origin:
      description: Exact configured external HTTPS origin, without a trailing slash or path.
      example: https://charging.example
      selector:
        text:
    confirm_shared_origin:
      description: Required when enabling. Confirm that all applications on this external origin share its wallet permission scope.
      default: false
      selector:
        boolean:
pay_energy_adjustment:
  name: Pay separate 5 kWh adjustment
  description: REAL MAINNET FUNDS. Administrator click authorises a separate 5 kWh adjustment at the current valid tariff to the current verified driver. Operator credits send immediately with a fresh fee quote within 1000 sat total. Driver debits issue a manual payment request, never consume charging consent. Existing or uncertain adjustments return their status without another attempt.
  fields:
    config_entry_id:
      required: true
      selector:
        text:
    proxy_config_entry_id:
      required: true
      selector:
        text:
    conversion_rate_entity:
      required: true
      selector:
        entity:
          domain: sensor
    energy_direction:
      required: true
      selector:
        select:
          options:
            - import
            - export
    request_id:
      description: Stable UUID. Reuse after a lost response; never generate a replacement to retry an uncertain payment.
      required: true
      selector:
        text:
    confirm_mainnet_payment:
      required: true
      selector:
        boolean:
prepare_energy_adjustment:
  name: Prepare separate 5 kWh adjustment
  description: Administrator only. Freeze the current registered driver and current live tariff for a separate real-value 5 kWh adjustment. Does not change metered sessions, consume charging consent, sign or send money. Negative prices reverse direction.
  fields:
    config_entry_id:
      required: true
      selector:
        text:
    proxy_config_entry_id:
      required: true
      selector:
        text:
    conversion_rate_entity:
      required: true
      selector:
        entity:
          domain: sensor
    energy_direction:
      required: true
      selector:
        select:
          options:
            - import
            - export
    request_id:
      description: Stable UUID for retry protection. Reuse the same UUID after a lost response.
      required: true
      selector:
        text:
prepare_adjustment_credit:
  name: Prepare fee-aware adjustment credit
  description: Prepare the approved adjustment using a fresh provider fee quote. Does not sign or broadcast. Recipient amount plus fee must fit 1000 sat.
  fields:
    config_entry_id:
      required: true
      selector:
        text:
    review_id:
      required: true
      selector:
        text:
    terms_hash:
      required: true
      selector:
        text:
prepare_operator_credit_recovery:
  name: Prepare original-recipient credit recovery
  description: Administrator only. Freeze an unsigned historical credit using its original signed receiving registration. Hold it for separate approval even if automatic credits resume. No signature or broadcast; funding is checked but not reserved.
  fields:
    config_entry_id:
      required: true
      selector:
        text:
    credit_id:
      required: true
      selector:
        text:
    parent_credit_id:
      description: Optional existing signed pending operator credit. Prepare an explicitly reviewed child payment from its change, with fees for both transactions. Same original recipient only. Does not sign, replace or resend the parent. Combined credits and fees must fit 1000 sat.
      selector:
        text:
    replace_expired_review_hash:
      description: Optional exact hash to explicitly renew an expired unsigned review. A signed credit can never be replaced.
      selector:
        text:
broadcast_operator_credit_recovery:
  name: Approve original-recipient credit
  description: REAL MAINNET FUNDS. Send only the exact reviewed historical credit. Original BRC-29 wallet receipt is retained. A signed or uncertain outcome can never be re-signed or rebroadcast by this action.
  fields:
    config_entry_id:
      required: true
      selector:
        text:
    credit_id:
      required: true
      selector:
        text:
    expected_review_hash:
      required: true
      selector:
        text:
    recipient_address:
      required: true
      selector:
        text:
    amount_sats:
      required: true
      selector:
        number:
          min: 1
          max: 999
          mode: box
    fee_sats:
      description: Exact quoted fee from the review. No separate fee ceiling; credit plus fee must stay within the 1000 sat total.
      required: true
      selector:
        number:
          min: 1
          mode: box
    confirm_mainnet_payment:
      required: true
      selector:
        boolean:
configure_automatic_credit:
  name: Set automatic operator credit policy
  description: Administrator only. Enable prospective session credits with no per-payment approval. Maximum total spend 1000 sat per session including a fresh provider-quoted, size-based fee. Missing or stale fee evidence blocks signing. Disable stops new signatures, not transactions already submitted.
  fields:
    config_entry_id:
      required: true
      selector:
        text:
    enabled:
      required: true
      selector:
        boolean:
prepare_session_review:
  name: Freeze session payment review
  description: Administrator only. Freeze a closed, fully priced proxy account, rate and driver details. No payment is requested or sent.
  fields:
    config_entry_id: &review_entry
      name: Mainnet operator wallet entry
      required: true
      selector:
        text:
    proxy_config_entry_id:
      name: Read-only session recorder entry
      required: true
      selector:
        text:
    session_id:
      required: true
      selector:
        text:
    conversion_rate_entity:
      name: Conversion rate sensor in sat/AUD
      required: true
      selector:
        entity:
          domain: sensor
approve_session_review:
  name: Approve frozen session account
  description: Administrator attestation of the account and driver details. Creates a manual driver request or permits unsigned credit preparation. Does not sign or broadcast.
  fields:
    config_entry_id: *review_entry
    review_id: &review_id
      required: true
      selector:
        text:
    terms_hash: &terms_hash
      name: Exact frozen terms hash
      required: true
      selector:
        text:
    recipient_address: &recipient
      name: Exact recipient address (null for a zero account)
      required: true
      selector:
        text:
    amount_sats: &sats
      name: Exact recipient amount
      required: true
      selector:
        number:
          min: 0
          max: 100000
          mode: box
    confirm_account_review:
      name: I reviewed the account and provisional metering allocation
      required: true
      selector:
        boolean:
    confirm_driver_details:
      name: I independently confirmed driver details (not cryptographic proof)
      required: true
      selector:
        boolean:
prepare_session_credit:
  name: Prepare unsigned session credit
  description: Prepare the exact reviewed operator-to-driver credit. Administrator only; no signing or broadcasting.
  fields:
    config_entry_id: *review_entry
    review_id: *review_id
    terms_hash: *terms_hash
    fee_sats: &review_fee
      name: Exact network fee (not a fee estimate)
      required: true
      selector:
        number:
          min: 1
          max: 1000
          mode: box
broadcast_session_credit:
  name: Approve and broadcast session credit
  description: REAL MAINNET FUNDS. Administrator must repeat the reviewed hash, draft, recipient, amount and fee. Never call automatically.
  fields:
    config_entry_id: *review_entry
    review_id: *review_id
    terms_hash: *terms_hash
    draft_id:
      required: true
      selector:
        text:
    recipient_address: *recipient
    amount_sats: *sats
    fee_sats: *review_fee
    confirm_mainnet_payment:
      name: I approve this exact real mainnet transfer and fee
      required: true
      selector:
        boolean:
verify_session_driver_payment:
  name: Verify driver-reported payment output
  description: Read-only provider checks of the exact output. Administrator must independently attest the driver's reference. Does not prove payer identity or independent chain finality.
  fields:
    config_entry_id: *review_entry
    review_id: *review_id
    txid:
      name: Driver-supplied blockchain transaction ID
      required: true
      selector:
        text:
    output_index:
      required: true
      selector:
        number:
          min: 0
          mode: box
    confirm_driver_payment_reference:
      name: I independently confirmed this payment reference with the driver
      required: true
      selector:
        boolean:
cancel_session_review:
  name: Cancel unsigned session review
  description: Cancel an unissued driver request or an unsigned operator credit. Issued driver requests and signed credits cannot be cancelled or silently replaced.
  fields:
    config_entry_id: *review_entry
    review_id: *review_id
session_review_status:
  name: Read session review status
  description: Administrator-only local status read. Does not refresh provider evidence or broadcast.
  fields:
    config_entry_id: *review_entry
    review_id:
      required: false
      selector:
        text:
    include_tariff_provenance:
      name: Include tariff provenance
      description: Return the full frozen tariff provenance (source observations and digests) instead of the compact summary. Read-only.
      required: false
      default: false
      selector:
        boolean:
bind_session:
  name: Bind session
  description: Administrator only. Start a frozen, draft-only session against the external driver wallet. Never pays.
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: bsv_settlement
    session_id:
      required: true
      selector:
        text:
    started_at:
      required: true
      example: "2026-10-02T02:00:00Z"
      selector:
        text:
    driver_binding_id:
      required: true
      default: driver-external
      selector:
        text:
add_interval:
  name: Add metered interval
  description: Administrator only. Persist one validated interval with final directional prices.
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: bsv_settlement
    session_id:
      required: true
      selector:
        text:
    interval:
      required: true
      selector:
        object:
prepare_session:
  name: Prepare session
  description: Administrator only. Reconcile energy, freeze the ledger and record a blocked settlement draft; never pays.
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: bsv_settlement
    session_id:
      required: true
      selector:
        text:
    ended_at:
      required: true
      selector:
        text:
    final_import_wh:
      required: true
      selector:
        number:
          min: 0
          max: 10000000
          mode: box
          unit_of_measurement: Wh
    final_export_wh:
      required: true
      selector:
        number:
          min: 0
          max: 10000000
          mode: box
          unit_of_measurement: Wh
refresh:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: bsv_settlement
wallet_status:
  name: Operator wallet status
  description: Administrator only. Read the mainnet operator wallet status without network access or key export.
  fields:
    config_entry_id:
      required: true
      selector:
        text:
wallet_self_test:
  name: Offline operator wallet self-test
  description: Administrator only. Verify a real SDK signature and sign a fictional-source transaction with the operator key; only a digest is saved. No broadcast or funds.
  fields:
    config_entry_id:
      required: true
      selector:
        text:
wallet_refresh_chain:
  name: Refresh mainnet wallet
  description: Read provider-reported confirmed UTXOs and payment status. Administrator only; does not broadcast.
  fields:
    config_entry_id:
      required: true
      selector:
        text:
prepare_operator_payment:
  name: Prepare operator payment
  description: Prepare an unsigned mainnet payment to the submitted driver address. Administrator only.
  fields:
    config_entry_id:
      required: true
      selector:
        text:
    reference:
      required: true
      selector:
        text:
    amount_sats:
      required: true
      selector:
        number:
          min: 1
          max: 100000
          mode: box
    fee_sats:
      required: true
      selector:
        number:
          min: 1
          max: 1000
          mode: box
broadcast_operator_payment:
  name: Approve and broadcast operator payment
  description: REAL MONEY. Repeat the exact prepared recipient, amount and fee. Administrator approval required.
  fields:
    config_entry_id:
      required: true
      selector:
        text:
    draft_id:
      required: true
      selector:
        text:
    recipient_address:
      required: true
      selector:
        text:
    amount_sats:
      required: true
      selector:
        number:
          min: 1
          max: 100000
          mode: box
    fee_sats:
      required: true
      selector:
        number:
          min: 1
          max: 1000
          mode: box
    confirm_mainnet_payment:
      required: true
      selector:
        boolean:
cancel_operator_payment:
  name: Cancel unsigned operator payment
  description: Cancel an unsigned prepared or expired draft. A submitted payment cannot be cancelled here.
  fields:
    config_entry_id:
      required: true
      selector:
        text:
    draft_id:
      required: true
      selector:
        text:
purge_removed_backend_stores:
  name: Remove stores of a deleted testnet or mock entry
  description: Administrator only. Permanently delete the coordinator, wallet-ledger and unencrypted operator-key stores left by a deleted mock or embedded_testnet entry. Refused, with nothing removed, while any config entry has this ID, or if any store is a mainnet wallet, another backend's or unrecognised. Archive the files first if you may need them. Returns the removed store keys; repeat calls remove nothing.
  fields:
    entry_id:
      description: ID of the deleted mock or embedded_testnet config entry (the suffix of its .storage files).
      required: true
      selector:
        text:
    confirm:
      description: Confirm permanent deletion of that entry's stores.
      required: true
      selector:
        boolean:
create_session_budget:
  name: Create session budget invitation
  description: Sign an invitation before charging, or for a named open session. No payment, funds reservation or charger control.
  fields:
    initial_session_id:
      name: Include this current session in the fresh weekly approval
      description: Multi-session only. Must name the recorder's current session or its immediately previous completed account, without another settlement owner. Its charge and fees share the total allowance. Requires a fresh driver signature; never broadens an existing approval.
      selector: {text: {}}
    multi_session:
      default: false
      description: Fresh aggregate approval for future sessions, ending at expiry or a newer driver registration. Fees count toward the shared limit; credits do not replenish it. Requires automatic-credit receiving registration.
      selector: {boolean: {}}
    config_entry_id:
      required: true
      selector:
        text:
    proxy_config_entry_id:
      required: true
      selector:
        text:
    session_id:
      required: false
      selector:
        text:
    conversion_rate_entity:
      required: true
      selector:
        entity:
          domain: sensor
    max_total_sats:
      default: 1000
      description: Maximum total wallet debit, including the actual network fee. New invitations only.
      selector:
        number:
          min: 1
          max: 100000
          mode: box
    max_fee_sats:
      default: 1000
      description: Fee ceiling, not a quoted or fixed fee. The actual fee must also fit within the remaining total spending limit.
      selector:
        number:
          min: 0
          max: 1000
          mode: box
    replace_pending_budget_id:
      description: Optional exact ID of an unapproved invitation to replace. Signed approvals cannot be replaced.
      selector: {text: {}}
    expected_invitation_hash:
      description: SHA-256 of the original signed invitation payload, required for replacement.
      selector: {text: {}}
    confirm_replace_pending:
      description: Explicitly revoke the specified unapproved invitation and create a new one atomically.
      selector: {boolean: {}}
    valid_minutes:
      description: Defaults to 720 for one session or 10080 for multi-session. One-session maximum is 1440; multi-session maximum is 10080.
      selector:
        number:
          min: 1
          max: 10080
          mode: box
    operator_name:
      default: Charging operator
      selector:
        text:
    operator_contact:
      selector:
        text:
open_public_registration:
  name: Open registration for next driver
  description: Expose the exact unapproved multi-session invitation on the public page for up to 15 minutes. Preserves historical consents, recipients and settlements; never enables a payment policy.
  fields:
    config_entry_id: {required: true, selector: {text: {}}}
    budget_id: {required: true, selector: {text: {}}}
    expected_invitation_hash: {required: true, selector: {text: {}}}
    expected_context_hash: {required: true, selector: {text: {}}}
    confirm_public_registration: {required: true, selector: {boolean: {}}}
close_public_registration:
  name: Close public registration
  description: Hide and invalidate this pending public QR without revoking the private invitation or historical consent. Cannot revoke an approved driver.
  fields:
    config_entry_id: {required: true, selector: {text: {}}}
    budget_id: {required: true, selector: {text: {}}}
    expected_invitation_hash: {required: true, selector: {text: {}}}
    confirm_public_registration: {required: true, selector: {boolean: {}}}
accept_session_budget:
  name: Verify driver spending approval
  description: Verify and persist a versioned driver mandate. Wallet transaction permission is separate; old consent remains consent-only.
  fields:
    config_entry_id:
      required: true
      selector:
        text:
    budget_id:
      required: true
      selector:
        text:
    receipt:
      required: true
      selector:
        object:
revoke_session_budget:
  name: Revoke session budget consent
  description: Mark this invitation and its consent revoked in HA. Does not reverse payments.
  fields:
    config_entry_id:
      required: true
      selector:
        text:
    budget_id:
      required: true
      selector:
        text:
configure_ongoing_credit:
  name: Configure ongoing operator credits
  description: Administrator-authorised mainnet credits to the latest verified receiving registration. Fixed recipient and conversion per session, 1000 sat total cap including the fresh provider-quoted fee. This never grants driver debit authority.
  fields:
    config_entry_id:
      required: true
      selector:
        text:
    enabled:
      required: true
      selector:
        boolean:
    proxy_config_entry_id:
      selector:
        text:
    conversion_rate_entity:
      selector:
        entity:
          domain: sensor
    initial_session_id:
      description: Explicitly authorise this retained session, including if it began before policy activation. Other historical sessions are excluded.
      selector:
        text:
    expected_budget_id:
      selector:
        text:
    expected_recipient_address:
      selector:
        text:
    confirm_ongoing_mainnet_credits:
      selector:
        boolean:
get_credit_receipt_link:
  name: Recover original private link for a confirmed driver credit
  description: Administrator only. Returns the existing private session link after matching the confirmed credit, transaction and original receiving wallet. No payment, refresh, new invitation, token rotation or change to consent. Share the response only with the original driver.
  fields:
    config_entry_id:
      required: true
      selector: {text: {}}
    credit_id:
      required: true
      description: Exact budget_id from automatic_credit.payments, or credit_id from ongoing_credit.sessions.
      selector: {text: {}}
    expected_txid:
      required: true
      selector: {text: {}}
    expected_recipient_address:
      required: true
      description: Original receiving address shown on the selected payment, not the latest registered driver.
      selector: {text: {}}
    confirm_private_link_disclosure:
      required: true
      description: Reveal the original private capability in the administrator response. It retains its original scope; do not publish or log it.
      selector: {boolean: {}}
get_reviewed_collection_link:
  name: Retrieve the private link for a reviewed collection
  description: Administrator only. Returns the original private link only for an unclaimed recovery-ready collection. Does not rotate the link, extend approval, release a hold, or initiate payment. Treat the response as private.
  fields:
    config_entry_id:
      required: true
      selector: {text: {}}
    budget_id:
      required: true
      selector: {text: {}}
    expected_quote_hash:
      required: true
      selector: {text: {}}
    confirm_private_link_disclosure:
      required: true
      description: Reveal the existing private session capability in this administrator response. Share only with the approved driver.
      selector: {boolean: {}}
inspect_driver_collection:
  name: Inspect a retained driver transaction
  description: Administrator-only local inspection of one saved attempt. Returns bounded public outpoints and match results, not raw bytes or scripts. Does not query a provider, change the ledger, verify signatures, release a hold or authorise a retry.
  fields:
    config_entry_id:
      required: true
      selector: {text: {}}
    budget_id:
      required: true
      selector: {text: {}}
prepare_collection_recovery:
  name: Review a held driver collection
  description: Read-only review. Does not prove absence of a wallet payment or release the attempt.
  fields:
    config_entry_id:
      required: true
      selector: {text: {}}
    budget_id:
      required: true
      selector: {text: {}}
recover_driver_collection:
  name: Release a reviewed pre-signing collection
  description: Administrator only. Requires external wallet and recipient-history review. Refuses any signing permit or transaction. Invalidates the old claim and requires a new explicit driver confirmation. Does not send payment.
  fields:
    config_entry_id:
      required: true
      selector: {text: {}}
    budget_id:
      required: true
      selector: {text: {}}
    expected_quote_hash:
      required: true
      selector: {text: {}}
    expected_claimed_at:
      required: true
      selector: {text: {}}
    evidence_reference:
      required: true
      description: Nonsecret reference to the completed reconciliation. Do not paste wallet data, keys or private URLs.
      selector: {text: {}}
    confirm_driver_wallet_checked:
      required: true
      description: The driver wallet has no completed or signed payment for this account.
      selector: {boolean: {}}
    confirm_recipient_history_checked:
      required: true
      description: Confirmed and unconfirmed receiving-address history was checked and no payment belongs to this account.
      selector: {boolean: {}}
    confirm_unsigned_draft_cancelled_or_absent:
      required: true
      description: Any old unsigned wallet draft was cancelled, or the wallet confirms none exists.
      selector: {boolean: {}}
    confirm_old_driver_pages_closed:
      required: true
      description: All old driver pages are closed. A fresh page must explicitly confirm resuming.
      selector: {boolean: {}}
session_budget_status:
  name: Read session budget status
  description: Read a stored invitation and consent without making a wallet or chain request.
  fields:
    config_entry_id:
      required: true
      selector:
        text:
    budget_id:
      required: false
      selector:
        text:
    include_tariff_provenance:
      name: Include tariff provenance
      description: Return the full tariff provenance frozen into this approval's automatic collection or credit records instead of the compact summary. Read-only.
      required: false
      default: false
      selector:
        boolean:
bind_session_budget:
  name: Bind advance consent to a session
  description: Confirm the driver and bind advance approval to their session. A version 2 mandate enables session-end collection through the open driver page. No charger control.
  fields:
    config_entry_id:
      required: true
      selector:
        text:
    budget_id:
      required: true
      selector:
        text:
    session_id:
      required: true
      selector:
        text:
    confirm_driver_present:
      required: true
      selector:
        boolean:
prepare_session_closure:
  name: Review completed account
  description: Read-only review for post-session consent, waiver or zero-balance closure. Existing payment attempts must be reconciled.
  fields:
    config_entry_id: {required: true, selector: {text: {}}}
    proxy_config_entry_id: {required: true, selector: {text: {}}}
    session_id: {required: true, selector: {text: {}}}
    conversion_rate_entity: {required: true, selector: {entity: {domain: sensor}}}
request_closed_session_consent:
  name: Request consent for completed session
  description: Freeze a reviewed positive account and issue a private consent link. No payment is sent by this service. The driver must approve fresh terms.
  fields:
    config_entry_id: {required: true, selector: {text: {}}}
    proxy_config_entry_id: {required: true, selector: {text: {}}}
    session_id: {required: true, selector: {text: {}}}
    conversion_rate_entity: {required: true, selector: {entity: {domain: sensor}}}
    expected_review_hash: {required: true, selector: {text: {}}}
    reason: {required: true, description: Plain-text reason disclosed to the driver, selector: {text: {}}}
    confirm_account_review: {required: true, selector: {boolean: {}}}
    confirm_provisional_metering: {default: false, description: Accept only the supported energy/state timing warnings; all original warnings remain recorded, selector: {boolean: {}}}
    confirm_replace_pending: {default: false, description: Revoke the reviewed unapproved invitation and issue new closed-account terms, selector: {boolean: {}}}
    max_total_sats: {default: 1000, selector: {number: {min: 1, max: 100000, mode: box}}}
    max_fee_sats: {default: 1000, selector: {number: {min: 0, max: 1000, mode: box}}}
    valid_minutes: {default: 720, selector: {number: {min: 1, max: 1440, mode: box}}}
    operator_name: {default: Charging operator, selector: {text: {}}}
    operator_contact: {selector: {text: {}}}
waive_session_charge:
  name: Close completed account without payment
  description: Explicitly waive a positive driver charge or close an exact zero account. Never waives credits owed to drivers or clears payment attempts.
  fields:
    config_entry_id: {required: true, selector: {text: {}}}
    proxy_config_entry_id: {required: true, selector: {text: {}}}
    session_id: {required: true, selector: {text: {}}}
    conversion_rate_entity: {required: true, selector: {entity: {domain: sensor}}}
    expected_review_hash: {required: true, selector: {text: {}}}
    reason: {required: true, selector: {text: {}}}
    confirm_account_review: {required: true, selector: {boolean: {}}}
    confirm_provisional_metering: {default: false, selector: {boolean: {}}}
    confirm_no_payment: {required: true, description: Close the account without marking it paid or moving funds, selector: {boolean: {}}}
prepare_existing_charge_waiver:
  name: Review waiver of an existing driver charge
