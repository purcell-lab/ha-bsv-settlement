<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 2437" role="img" aria-labelledby="t d"><title id="t">Budget approval, dynamic settlement and wallet credit</title><desc id="d">Proposed sequence: authorise a budget, meter imports and exports, calculate dynamic cost in Home Assistant, then settle one debit or operator-funded credit. No prepayment or routine refund.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="1220" height="2437" fill="white"/><g font-family="Arial, sans-serif"><rect x="11" y="25" width="188" height="64" rx="7" fill="#f0f3f5" stroke="#c8d7dc"/><text x="105" y="60" text-anchor="middle" fill="#173c48" font-size="15" font-weight="600"><tspan x="105" dy="0">Driver</tspan></text><path d="M105 90V2422" stroke="#cbd7db" stroke-width="1" stroke-dasharray="4 6"/><rect x="251" y="25" width="188" height="64" rx="7" fill="#e9f2f3" stroke="#c8d7dc"/><text x="345" y="50" text-anchor="middle" fill="#173c48" font-size="15" font-weight="600"><tspan x="345" dy="0">Driver wallet</tspan><tspan x="345" dy="20">+ budget service</tspan></text><path d="M345 90V2422" stroke="#cbd7db" stroke-width="1" stroke-dasharray="4 6"/><rect x="511" y="25" width="188" height="64" rx="7" fill="#f0f3f5" stroke="#c8d7dc"/><text x="605" y="50" text-anchor="middle" fill="#173c48" font-size="15" font-weight="600"><tspan x="605" dy="0">Home Assistant</tspan><tspan x="605" dy="20">+ billing</tspan></text><path d="M605 90V2422" stroke="#cbd7db" stroke-width="1" stroke-dasharray="4 6"/><rect x="771" y="25" width="188" height="64" rx="7" fill="#f0f3f5" stroke="#c8d7dc"/><text x="865" y="50" text-anchor="middle" fill="#173c48" font-size="15" font-weight="600"><tspan x="865" dy="0">OCPP</tspan><tspan x="865" dy="20">charging station</tspan></text><path d="M865 90V2422" stroke="#cbd7db" stroke-width="1" stroke-dasharray="4 6"/><rect x="1021" y="25" width="188" height="64" rx="7" fill="#e9f2f3" stroke="#c8d7dc"/><text x="1115" y="50" text-anchor="middle" fill="#173c48" font-size="15" font-weight="600"><tspan x="1115" dy="0">Operator</tspan><tspan x="1115" dy="20">wallet</tspan></text><path d="M1115 90V2422" stroke="#cbd7db" stroke-width="1" stroke-dasharray="4 6"/><rect x="20" y="130" width="1180" height="65" rx="8" fill="#e9f2f3"/><text x="40" y="155" text-anchor="start" fill="#155e69" font-size="18"><tspan x="40" dy="0">01  Budget approval</tspan></text><text x="40" y="178" text-anchor="start" fill="#46616a" font-size="13"><tspan x="40" dy="0">Session-specific spending consent. No prepayment or movement of funds.</tspan></text><text x="355" y="222" text-anchor="middle" fill="#263b45" font-size="14"><tspan x="355" dy="0">Select EVSE and pricing terms</tspan></text><path d="M105 234H605" fill="none" stroke="#315f75" stroke-width="1.5"  marker-end="url(#arr)"/><text x="355" y="289" text-anchor="middle" fill="#263b45" font-size="14"><tspan x="355" dy="0">Tariff, maximum debit, FX and fee policy</tspan></text><path d="M605 301H105" fill="none" stroke="#315f75" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/><text x="225" y="338" text-anchor="middle" fill="#263b45" font-size="14"><tspan x="225" dy="0">Approve budget</tspan><tspan x="225" dy="18">and bind wallet</tspan></text><path d="M105 368H345" fill="none" stroke="#315f75" stroke-width="1.5"  marker-end="url(#arr)"/><text x="475" y="405" text-anchor="middle" fill="#263b45" font-size="14"><tspan x="475" dy="0">Verifiable session</tspan><tspan x="475" dy="18">authorisation</tspan></text><path d="M345 435H605" fill="none" stroke="#315f75" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/><rect x="38" y="487" width="1144" height="37" rx="5" fill="#fff" stroke="#dce4e7"/><text x="55" y="511" text-anchor="start" fill="#5d6d75" font-size="13"><tspan x="55" dy="0">Gate: validate merchant, session, limits and lifetime. If denied or invalid, do not start.</tspan></text><text x="735" y="550" text-anchor="middle" fill="#263b45" font-size="14"><tspan x="735" dy="0">Request session start</tspan></text><path d="M605 562H865" fill="none" stroke="#315f75" stroke-width="1.5"  marker-end="url(#arr)"/><text x="735" y="599" text-anchor="middle" fill="#263b45" font-size="14"><tspan x="735" dy="0">Started event +</tspan><tspan x="735" dy="18">transaction ID</tspan></text><path d="M865 629H605" fill="none" stroke="#315f75" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/><text x="475" y="666" text-anchor="middle" fill="#263b45" font-size="14"><tspan x="475" dy="0">Bind mandate to</tspan><tspan x="475" dy="18">OCPP transaction</tspan></text><path d="M605 696H345" fill="none" stroke="#315f75" stroke-width="1.5"  marker-end="url(#arr)"/><rect x="20" y="763" width="1180" height="65" rx="8" fill="#e9f2f3"/><text x="40" y="788" text-anchor="start" fill="#155e69" font-size="18"><tspan x="40" dy="0">02  Dynamic valuation</tspan></text><text x="40" y="811" text-anchor="start" fill="#46616a" font-size="13"><tspan x="40" dy="0">Repeat the metering loop while the session is active.</tspan></text><text x="735" y="837" text-anchor="middle" fill="#263b45" font-size="14"><tspan x="735" dy="0">Timestamped import /</tspan><tspan x="735" dy="18">export readings</tspan></text><path d="M865 867H605" fill="none" stroke="#315f75" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/><path d="M605 934h72v23h-72" fill="none" stroke="#315f75" stroke-width="1.5" marker-end="url(#arr)"/><text x="593" y="926" text-anchor="end" fill="#263b45" font-size="14"><tspan x="593" dy="0">Validate readings; apply</tspan><tspan x="593" dy="18">dynamic interval prices</tspan></text><text x="475" y="972" text-anchor="middle" fill="#263b45" font-size="14"><tspan x="475" dy="0">Running debit exposure</tspan><tspan x="475" dy="18">plus stop margin</tspan></text><path d="M605 1002H345" fill="none" stroke="#315f75" stroke-width="1.5"  marker-end="url(#arr)"/><text x="475" y="1039" text-anchor="middle" fill="#263b45" font-size="14"><tspan x="475" dy="0">Remaining authority</tspan><tspan x="475" dy="18">or stop decision</tspan></text><path d="M345 1069H605" fill="none" stroke="#315f75" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/><text x="735" y="1106" text-anchor="middle" fill="#263b45" font-size="14"><tspan x="735" dy="0">Stop / suspend if</tspan><tspan x="735" dy="18">budget requires it</tspan></text><path d="M605 1136H865" fill="none" stroke="#315f75" stroke-width="1.5"  marker-end="url(#arr)"/><rect x="38" y="1188" width="1144" height="37" rx="5" fill="#fff" stroke="#dce4e7"/><text x="55" y="1212" text-anchor="start" fill="#5d6d75" font-size="13"><tspan x="55" dy="0">CSIP-AUS, electrical safety and device limits always apply, independently of payment permission.</tspan></text><text x="735" y="1233" text-anchor="middle" fill="#263b45" font-size="14"><tspan x="735" dy="0">Ended event +</tspan><tspan x="735" dy="18">final meter readings</tspan></text><path d="M865 1263H605" fill="none" stroke="#315f75" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/><path d="M605 1330h72v23h-72" fill="none" stroke="#315f75" stroke-width="1.5" marker-end="url(#arr)"/><text x="593" y="1322" text-anchor="end" fill="#263b45" font-size="14"><tspan x="593" dy="0">Reconcile and freeze</tspan><tspan x="593" dy="18">final cost / credit</tspan></text><rect x="20" y="1398" width="1180" height="65" rx="8" fill="#e9f2f3"/><text x="40" y="1423" text-anchor="start" fill="#155e69" font-size="18"><tspan x="40" dy="0">03  Wallet settlement</tspan></text><text x="40" y="1446" text-anchor="start" fill="#46616a" font-size="13"><tspan x="40" dy="0">C = import cost − export earnings + agreed fees. Exactly one settlement outcome.</tspan></text><path d="M32 1492H1188" stroke="#b6cbd0" stroke-width="1"/><rect x="35" y="1477" width="560" height="30" fill="#fff"/><text x="48" y="1497" text-anchor="start" fill="#155e69" font-size="14"><tspan x="48" dy="0">DEBIT  ·  C &gt; 0  ·  Driver pays the operator</tspan></text><text x="475" y="1511" text-anchor="middle" fill="#263b45" font-size="14"><tspan x="475" dy="0">Actual debit request</tspan><tspan x="475" dy="18">+ statement hash</tspan></text><path d="M605 1541H345" fill="none" stroke="#315f75" stroke-width="1.5"  marker-end="url(#arr)"/><rect x="38" y="1593" width="1144" height="37" rx="5" fill="#fff" stroke="#dce4e7"/><text x="55" y="1617" text-anchor="start" fill="#5d6d75" font-size="13"><tspan x="55" dy="0">Driver wallet checks session mandate, spend limits, network fees and available funds.</tspan></text><text x="730" y="1656" text-anchor="middle" fill="#263b45" font-size="14"><tspan x="730" dy="0">Sign and submit actual debit C in BSV</tspan></text><path d="M345 1668H1115" fill="none" stroke="#315f75" stroke-width="1.5"  marker-end="url(#arr)"/><path d="M32 1725H1188" stroke="#b6cbd0" stroke-width="1"/><rect x="35" y="1710" width="560" height="30" fill="#fff"/><text x="48" y="1730" text-anchor="start" fill="#18735c" font-size="14"><tspan x="48" dy="0">CREDIT  ·  C &lt; 0  ·  Operator pays the driver</tspan></text><text x="860" y="1762" text-anchor="middle" fill="#263b45" font-size="14"><tspan x="860" dy="0">Funded payout request + statement hash</tspan></text><path d="M605 1774H1115" fill="none" stroke="#18735c" stroke-width="1.5"  marker-end="url(#arr)"/><rect x="38" y="1826" width="1144" height="37" rx="5" fill="#fff" stroke="#dce4e7"/><text x="55" y="1850" text-anchor="start" fill="#5d6d75" font-size="13"><tspan x="55" dy="0">Operator wallet checks its own payout authority and available funds. A credit requires a funded payer.</tspan></text><text x="730" y="1889" text-anchor="middle" fill="#263b45" font-size="14"><tspan x="730" dy="0">Sign and submit wallet credit |C| in BSV</tspan></text><path d="M1115 1901H345" fill="none" stroke="#18735c" stroke-width="1.5"  marker-end="url(#arr)"/><path d="M32 1958H1188" stroke="#b6cbd0" stroke-width="1"/><rect x="35" y="1943" width="560" height="30" fill="#fff"/><text x="48" y="1963" text-anchor="start" fill="#155e69" font-size="14"><tspan x="48" dy="0">ZERO  ·  C = 0  ·  No transfer</tspan></text><rect x="38" y="1992" width="1144" height="37" rx="5" fill="#fff" stroke="#dce4e7"/><text x="55" y="2016" text-anchor="start" fill="#5d6d75" font-size="13"><tspan x="55" dy="0">Record a zero settlement and close unused spending authority.</tspan></text><path d="M32 2057H1188" stroke="#b6cbd0" stroke-width="1"/><rect x="35" y="2042" width="560" height="30" fill="#fff"/><text x="48" y="2062" text-anchor="start" fill="#155e69" font-size="14"><tspan x="48" dy="0">COMPLETE OR RECOVER  ·  Applies to debit and credit</tspan></text><text x="475" y="2076" text-anchor="middle" fill="#263b45" font-size="14"><tspan x="475" dy="0">Driver-wallet status</tspan><tspan x="475" dy="18">+ payment reference</tspan></text><path d="M345 2106H605" fill="none" stroke="#315f75" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/><text x="860" y="2161" text-anchor="middle" fill="#263b45" font-size="14"><tspan x="860" dy="0">Operator-wallet status + payment reference</tspan></text><path d="M1115 2173H605" fill="none" stroke="#315f75" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/><rect x="38" y="2225" width="1144" height="37" rx="5" fill="#fff" stroke="#dce4e7"/><text x="55" y="2249" text-anchor="start" fill="#5d6d75" font-size="13"><tspan x="55" dy="0">Accepted: close unused authority and issue receipt. Failed / unavailable: retain settlement pending.</tspan></text><text x="355" y="2288" text-anchor="middle" fill="#263b45" font-size="14"><tspan x="355" dy="0">Itemised receipt or pending-settlement notice</tspan></text><path d="M605 2300H105" fill="none" stroke="#315f75" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/><rect x="38" y="2352" width="1144" height="37" rx="5" fill="#fff" stroke="#dce4e7"/><text x="55" y="2376" text-anchor="start" fill="#5d6d75" font-size="13"><tspan x="55" dy="0">No routine refund. Idempotent retries prevent double payment. Acceptance is not mined confirmation.</tspan></text></g></svg>