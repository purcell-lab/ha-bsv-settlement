# Add the mapping below to scripts.yaml, then reload scripts.
# Run script.bsv_mock_credit_demo and select your config entry.
bsv_mock_credit_demo:
  alias: BSV mock credit demonstration
  description: Synthetic AUD0.30 credit. Requests approval but does not approve.
  mode: single
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: bsv_settlement
  sequence:
    - variables:
        demo_session: "ha-demo-{{ now().isoformat() }}"
    - action: bsv_settlement.bind_session
      data:
        config_entry_id: "{{ config_entry_id }}"
        session_id: "{{ demo_session }}"
        started_at: "2026-10-02T02:00:00Z"
        driver_binding_id: driver-demo-01
    - action: bsv_settlement.add_interval
      data:
        config_entry_id: "{{ config_entry_id }}"
        session_id: "{{ demo_session }}"
        interval:
          start: "2026-10-02T02:00:00Z"
          end: "2026-10-02T02:30:00Z"
          import_wh: 3000
          export_wh: 2000
          import_price_aud_per_kwh: "0.30"
          export_price_aud_per_kwh: "0.60"
          price_status: final
          tariff_version: demo-v1
          meter_quality: validated
    - action: bsv_settlement.prepare_session
      data:
        config_entry_id: "{{ config_entry_id }}"
        session_id: "{{ demo_session }}"
        ended_at: "2026-10-02T02:30:00Z"
        final_import_wh: 3000
        final_export_wh: 2000
    - action: bsv_settlement.request_payment
      data:
        config_entry_id: "{{ config_entry_id }}"
        session_id: "{{ demo_session }}"
