name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python and Home Assistant tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt "homeassistant==2026.9.4" pytest-asyncio
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: frontend/driver
      - name: Run tests
        run: python -m pytest -q tests
      - name: Compile Python
        run: python -m compileall -q wallet_service custom_components scripts

  hacs:
    name: HACS repository validation
    runs-on: ubuntu-latest
    steps:
      - name: Validate custom integration
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
          comment: "false"

  driver:
    name: Driver wallet consent tests and reproducible bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/driver/package-lock.json
      - run: npm ci
        working-directory: frontend/driver
      - run: npm test && npm run build
        working-directory: frontend/driver
      - run: git diff --exit-code -- custom_components/bsv_settlement/frontend/driver/app.bundle.js

  operator:
    name: Operator UX tests and reproducible cards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: frontend
      - run: git diff --exit-code -- custom_components/bsv_settlement/frontend frontend/bsv-session-review-card.bundle.js frontend/bsv-budget-card.bundle.js
