name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Supported Home Assistant matrix (docs/release-checklist.md). The pinned
  # minimum keeps the original check name so branch protection is unchanged;
  # every other version gets a suffixed name. Update both jobs together.
  tests:
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - homeassistant: "2026.9.4"
            check: Python and Home Assistant tests
          - homeassistant: "2026.10.0b2"
            check: Python and Home Assistant tests (HA 2026.10.0b2)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt "homeassistant==${{ matrix.homeassistant }}" pytest-asyncio
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: frontend/driver
      - name: Run tests
        run: python scripts/validate.py python

  clean-install:
    name: Clean install smoke test (HA ${{ matrix.homeassistant }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        homeassistant: ["2026.9.4", "2026.10.0b2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      # Only Home Assistant and the manifest's own requirements, as a user install has.
      - name: Install Home Assistant and manifest requirements
        run: |
          python -m pip install "homeassistant==${{ matrix.homeassistant }}" \
            $(python -c "import json; print(' '.join(json.load(open('custom_components/bsv_settlement/manifest.json'))['requirements']))")
      - name: Install shipped integration into an empty config and set it up
        run: python scripts/clean_install_smoke.py

  hacs:
    name: HACS repository validation
    runs-on: ubuntu-24.04
    steps:
      - name: Validate custom integration
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
          comment: "false"

  driver:
    name: Driver wallet consent tests and reproducible bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/driver/package-lock.json
      - run: npm ci
        working-directory: frontend/driver
      - run: npm test && npm run build
        working-directory: frontend/driver
      - run: git diff --exit-code -- custom_components/bsv_settlement/frontend/driver

  operator:
    name: Operator UX tests and reproducible cards
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: frontend
      - run: git diff --exit-code -- custom_components/bsv_settlement/frontend frontend/bsv-session-review-card.bundle.js frontend/bsv-budget-card.bundle.js
